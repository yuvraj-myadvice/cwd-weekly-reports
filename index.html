<!DOCTYPE html>
<html lang="en">
<head>

<title>CWD Weekly Reports</title>
<style>
  :root{color-scheme:light;}

  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f9;color:#1a1a2e;padding:48px 32px;max-width:680px;margin:0 auto;}

  .report-list a:hover{background:#f5f0ff;border-radius:8px;}
  .report-name{font-weight:600;font-size:13px;}
  .report-date{font-size:11px;color:#888;}
  .badge-latest{font-size:10px;font-weight:700;background:#22c55e;color:#fff;padding:2px 8px;border-radius:10px;margin-left:8px;}
  footer{margin-top:32px;font-size:11px;color:#bbb;text-align:center;}
